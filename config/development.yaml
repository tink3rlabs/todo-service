---
service:
  port: 8080
  url: http://localhost:8080
storage:
  # supported types are memory, sql and dynamodb
  type: memory
  # config:
  #   provider: postgresql
  #   host: host.docker.internal
  #   port: 5432
  #   user: todo
  #   password: todo
  #   dbname: todo
  #   schema: todo
  # config:
  #   provider: mysql
  #   host: host.docker.internal
  #   port: 3306
  #   user: todo
  #   password: todo
  #   dbname: todo
  #   schema: todo
  # config:
  #   provider: sqlite
  #   path: todo.sqlite
  # config:
  #   region: us-west-2
  #   endpoint: "http://host.docker.internal:8000"
  #   access_key: fake
  #   secret_key: fake
  #   global: false
  #   regions:
  #     - us-west-2
  #     - us-east-1
  #     - eu-west-1
leadership:
  # specify the interval to update node heartbeat
  heartbeat: 60s
health:
  # if true, readiness checks will check the health of the configured storage adapter
  storage: true
  # list of dependency URLs. If not empty will perform a GET request for each URL
  # and fail the readiness check if any fail or return a status code > 399
  dependencies: ~
auth:
  # set enabled: true and configure issuer/audience to require JWTs
  enabled: false
  issuer_url: ""
  # audience accepts one or more values, e.g.:
  #   audience:
  #     - https://api.todo-service.example
  audience: []
  # role required to create/replace/delete todos when auth is enabled
  write_role: todo_writer
logger:
  level: info
  json: false
observability:
  service_name: todo-service
  # metrics_mode: prometheus | otlp
  metrics_mode: prometheus
  enable_tracing: false
  # traces_otlp_endpoint: otel-collector:4317
pubsub:
  # set enabled: true and configure topic_arn to publish todo events to SNS
  enabled: false
  topic_arn: ""
  region: us-east-1